name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # Known vulnerabilities in the code the backend actually calls, its
  # dependencies' and the standard library's. The standard library is that
  # of the toolchain line in go.mod, which the release image's builder
  # matches, so a Go security release fails this until both are raised.
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      # test-chart.sh checks the alert rules with promtool and runs their
      # scenarios, and fails under CI without it. A pinned Prometheus
      # release (an LTS line), the archive checked against its checksum.
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: 3.13.5
          PROMETHEUS_SHA256: 0388822ace519c5a3a8ef556a541ce1b536e21d872f82deded465bd27a5a0699
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/$archive.tar.gz"
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/promtool"
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP/promtool" --strip-components=1 "$archive/promtool"
          "$RUNNER_TEMP/promtool/promtool" --version
          echo "$RUNNER_TEMP/promtool" >> "$GITHUB_PATH"
      - run: helm lint deploy/helm/kubeat
      - run: helm template kubeat deploy/helm/kubeat > /dev/null
      - run: deploy/helm/test-chart.sh
