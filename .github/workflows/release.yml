name: Release

# A version tag publishes the images and the chart:
#   ghcr.io/yusufceng/kubeat-backend:<version>, kubeat-frontend:<version> (amd64, arm64)
#   oci://ghcr.io/yusufceng/charts/kubeat --version <version>
# Run by hand (workflow_dispatch, e.g. gh workflow run release.yml --ref
# <branch>) it is a dry run: the checks run and the images and the chart are
# built, but nothing is pushed and no tag is touched.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Before anything is pushed: the tag must be Chart.yaml's version, and the
  # install and mirroring commands in README.md and docs/pilot.md, the
  # Makefile and appVersion must name it too (scripts/check-versions.sh).
  # If not, the jobs below do not run. A dry run has no tag to check; its
  # version is Chart.yaml's.
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag, the chart and the docs name one version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/check-versions.sh "$GITHUB_REF_NAME"
          else
            scripts/check-versions.sh
          fi
      - id: version
        run: echo "version=$(awk '/^version:/ { v = $2; gsub(/["\047]/, "", v); print v; exit }' deploy/helm/kubeat/Chart.yaml)" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ needs.versions.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeat-${{ matrix.component }}:${{ needs.versions.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kubeat-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}

  chart:
    runs-on: ubuntu-latest
    needs: [versions, images]
    steps:
      - uses: actions/checkout@v7
      # The Helm CI tests the chart with (ci.yml); raise the two together.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - run: helm lint deploy/helm/kubeat
      - run: helm package deploy/helm/kubeat --destination dist
      - if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
      - if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: helm push "dist/kubeat-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
