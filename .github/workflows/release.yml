name: Release

# A version tag publishes the images and the chart:
#   ghcr.io/yusufceng/kubeat-backend:<version>, kubeat-frontend:<version> (amd64, arm64)
#   oci://ghcr.io/yusufceng/charts/kubeat --version <version>
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeat-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kubeat-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: The tag must match the chart
        run: |
          test "$(grep '^version:' deploy/helm/kubeat/Chart.yaml | awk '{print $2}')" = "${{ steps.version.outputs.version }}" \
            || (echo "Chart.yaml version differs from the tag"; exit 1)
      - run: helm lint deploy/helm/kubeat
      - run: helm package deploy/helm/kubeat --destination dist
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
      - run: helm push dist/kubeat-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
