name: Release

# A version tag publishes, signs and describes a release:
#   ghcr.io/yusufceng/kubeat-backend:<version>, kubeat-frontend:<version>
#     (amd64, arm64; BuildKit's SPDX SBOM and SLSA provenance in the index)
#   oci://ghcr.io/yusufceng/charts/kubeat --version <version>
# Only a commit on main or a release/v* branch whose CI push run passed is
# released; the first job checks that before anything is built. cosign signs
# the three digests keyless (GitHub OIDC, Sigstore), the signatures are
# verified as README "Tedarik zinciri" tells users to, on a mirror and with
# no network too, and the tag's GitHub Release links the version's upgrade
# notes, lists the digests and carries the SBOMs. Nothing pushes `latest`.
# Run by hand (workflow_dispatch, e.g. gh workflow run release.yml --ref
# <branch>) it is a dry run of all of that under packages of its own,
# ghcr.io/yusufceng/kubeat-dry-run/..., never the release packages: no release
# tag is pushed or moved and no GitHub Release is made; the notes and the
# SBOMs are the run's artifact. CONTRIBUTING.md, "Sürümler".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Least privilege: the workflow's default grants only read. packages: write
  # is declared on the jobs that push (images, chart) and on sign; no other
  # job may write to packages. CONTRIBUTING.md, "Yayım iş akışı".
  contents: read

env:
  # Where this run pushes: the release packages for a tag, packages of their
  # own for a dry run, which the release manager deletes afterwards.
  REGISTRY_PATH: ${{ github.event_name == 'push' && format('ghcr.io/{0}', github.repository_owner) || format('ghcr.io/{0}/kubeat-dry-run', github.repository_owner) }}
  PLATFORMS: linux/amd64,linux/arm64
  # Pinned (CONTRIBUTING.md, "Sabit araç sürümleri"): the checksum is that of
  # cosign-linux-amd64 in the release's cosign_checksums.txt.
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  # Pinned the same way: the checksum is that of
  # oras_<version>_linux_amd64.tar.gz in the release's checksums.txt.
  ORAS_VERSION: v1.3.6
  ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0

jobs:
  # Before anything is built or pushed. The tag must be Chart.yaml's version,
  # and the install and mirroring commands in README.md and docs/pilot.md,
  # the Makefile and appVersion must name it too (scripts/check-versions.sh).
  # Then the gate (scripts/release-gate.sh): the tagged commit is on main or
  # a release/v* branch, and CI's push run on it passed the five checks
  # main's ruleset requires; while CI still runs, the gate waits for it, 30
  # minutes at most. If either fails, the jobs below do not run. A dry run
  # has no tag: its version is Chart.yaml's, and its gate takes CI's run on
  # the branch's head, the pull request's, and does not ask about branches.
  versions:
    runs-on: ubuntu-latest
    # The gate's 30 minutes and the rest; a hung call to GitHub ends here.
    timeout-minutes: 40
    permissions:
      contents: read
      # The gate reads CI's runs and their jobs; no other job may.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag, the chart and the docs name one version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/check-versions.sh "$GITHUB_REF_NAME"
          else
            scripts/check-versions.sh
          fi
      # The gate takes the commit checked out, the one the jobs below build;
      # for an annotated tag too, that is the tagged commit.
      - name: The commit is on main or a release branch, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/release-gate.sh tag "$(git rev-parse HEAD)"
          else
            scripts/release-gate.sh dry-run "$(git rev-parse HEAD)"
          fi
      - id: version
        run: echo "version=$(awk '/^version:/ { v = $2; gsub(/["\047]/, "", v); print v; exit }' deploy/helm/kubeat/Chart.yaml)" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: versions
    # Pushes the images, so it is one of the jobs that write packages.
    permissions:
      contents: read
      packages: write
    # GitHub merges the outputs of a matrix's jobs; each sets the one named
    # after its component.
    outputs:
      backend: ${{ steps.digest.outputs.backend }}
      frontend: ${{ steps.digest.outputs.frontend }}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version tag only. The SBOM and the provenance (mode=max: the
      # build's parameters and sources) go into the image's index as
      # attestations, so the signature on the index's digest covers them.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ needs.versions.outputs.version }}
          tags: ${{ env.REGISTRY_PATH }}/kubeat-${{ matrix.component }}:${{ needs.versions.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}
      - id: digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest from the build: '$DIGEST'"; exit 1; }
          echo "$COMPONENT=$DIGEST" >> "$GITHUB_OUTPUT"
      # The index's SPDX SBOMs, one per platform, for the Release.
      - name: SBOMs
        env:
          IMAGE: ${{ env.REGISTRY_PATH }}/kubeat-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          NAME: kubeat-${{ matrix.component }}-${{ needs.versions.outputs.version }}
        run: |
          mkdir -p sbom
          for platform in ${PLATFORMS//,/ }; do
            file="sbom/$NAME-${platform//\//-}.spdx.json"
            docker buildx imagetools inspect "$IMAGE" --format "{{ json (index .SBOM \"$platform\").SPDX }}" > "$file"
            jq -e '.spdxVersion | startswith("SPDX-")' "$file" > /dev/null || { echo "$file: not an SPDX document"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component }}
          path: sbom/
          if-no-files-found: error
          overwrite: true

  chart:
    runs-on: ubuntu-latest
    needs: [versions, images]
    # Pushes the chart, so it is one of the jobs that write packages.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Helm CI tests the chart with (ci.yml); raise the two together.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: helm lint deploy/helm/kubeat
      - run: helm package deploy/helm/kubeat --destination dist
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
      # helm push prints the digest it pushed; the sign job signs that one.
      - id: push
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          helm push "dist/kubeat-$VERSION.tgz" "oci://$REGISTRY_PATH/charts" > push.log 2>&1 || { cat push.log; exit 1; }
          cat push.log
          digest="$(awk '$1 == "Digest:" { print $2 }' push.log)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in helm push's output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The only job that may ask GitHub for an OIDC token, and it runs nothing
  # but cosign: keyless signatures (a Fulcio certificate for release.yml at
  # this run's ref, an entry in Rekor) on the digests the build and helm push
  # reported. Each signature is pushed next to its artifact as a Sigstore
  # bundle (an OCI 1.1 referrer; on ghcr.io the sha256-<digest> tag).
  sign:
    runs-on: ubuntu-latest
    needs: [images, chart]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Sign the digests
        env:
          BACKEND_DIGEST: ${{ needs.images.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.images.outputs.frontend }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          for digest in "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$CHART_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: '$digest'"; exit 1; }
          done
          for ref in "$REGISTRY_PATH/kubeat-backend@$BACKEND_DIGEST" \
            "$REGISTRY_PATH/kubeat-frontend@$FRONTEND_DIGEST" \
            "$REGISTRY_PATH/charts/kubeat@$CHART_DIGEST"; do
            cosign sign --yes --oidc-provider github-actions "$ref"
          done

  # Checks the signatures as README "Tedarik zinciri" tells users to, with
  # read-only access like theirs and the identity README names (release.yml
  # at this run's ref): online; then as an air-gapped site does, with no
  # network, on copies mirrored with their signatures into a registry of the
  # job's own and on copies saved to disk. Then writes the Release notes
  # (scripts/release-notes.sh) and keeps them with the SBOMs.
  verify:
    runs-on: ubuntu-latest
    needs: [versions, images, chart, sign]
    permissions:
      contents: read
      packages: read
    # The air-gapped site's internal registry: Distribution's, plain HTTP on
    # the runner's localhost:5000. Like ghcr.io it has no referrers API, so
    # the signatures travel under the referrers tag (sha256-<digest>).
    services:
      registry:
        # Pinned by digest (the tag is kept for readability); raised with the
        # registry row in CONTRIBUTING.md, "Sabit araç sürümleri".
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
        # The steps start once it answers.
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:5000/v2/"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      VERSION: ${{ needs.versions.outputs.version }}
      BACKEND_DIGEST: ${{ needs.images.outputs.backend }}
      FRONTEND_DIGEST: ${{ needs.images.outputs.frontend }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
      DRY_RUN: ${{ github.event_name != 'push' }}
      MIRROR: localhost:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/cosign" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install oras
        run: |
          curl -fsSLo "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/$ORAS_VERSION/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/bin" oras
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A dry run's packages may be private.
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify the signatures
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$REGISTRY_PATH/kubeat-backend@$BACKEND_DIGEST" \
            "$REGISTRY_PATH/kubeat-frontend@$FRONTEND_DIGEST" \
            "$REGISTRY_PATH/charts/kubeat@$CHART_DIGEST"
      # README "İmzalarla aynalamak" and docs/pilot.md, from the digests: each
      # artifact goes to the mirror with its signature (oras cp -r) under the
      # version's tag, and that tag must name the digest that was signed.
      - name: Mirror with the signatures
        run: |
          mirror() {
            oras cp -r --to-plain-http "$1@$3" "$MIRROR/$2:$VERSION"
            got="$(oras resolve --plain-http "$MIRROR/$2:$VERSION")"
            if [ "$got" != "$3" ]; then
              echo "$MIRROR/$2:$VERSION is $got, not $3: the copy has another digest"
              exit 1
            fi
          }
          mirror "$REGISTRY_PATH/kubeat-backend" kubeat/kubeat-backend "$BACKEND_DIGEST"
          mirror "$REGISTRY_PATH/kubeat-frontend" kubeat/kubeat-frontend "$FRONTEND_DIGEST"
          mirror "$REGISTRY_PATH/charts/kubeat" charts/kubeat "$CHART_DIGEST"
      # README "Hava boşluklu ortamda doğrulamak": the trusted root from
      # Sigstore's TUF repository, then the checks with --trusted-root while
      # a proxy that refuses every connection stands in for the air gap. Go
      # never sends a request for localhost through a proxy, so the mirror
      # stays reachable; Sigstore and ghcr.io do not. First the mirrored
      # copies, by the tags docs/pilot.md uses and by digest as README does;
      # then the three saved to disk with their signatures (cosign save), as
      # for carrying them in.
      - name: Verify offline
        run: |
          cosign initialize
          root="$HOME/.sigstore/root/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          test -s "$root" || { echo "no trusted root at $root"; exit 1; }
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= \
            cosign verify --trusted-root "$root" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$MIRROR/kubeat/kubeat-backend:$VERSION" \
              "$MIRROR/kubeat/kubeat-frontend:$VERSION" \
              "$MIRROR/charts/kubeat:$VERSION" \
              "$MIRROR/kubeat/kubeat-backend@$BACKEND_DIGEST" \
              "$MIRROR/kubeat/kubeat-frontend@$FRONTEND_DIGEST" \
              "$MIRROR/charts/kubeat@$CHART_DIGEST"
          cosign save --dir "$RUNNER_TEMP/offline/backend" "$REGISTRY_PATH/kubeat-backend@$BACKEND_DIGEST"
          cosign save --dir "$RUNNER_TEMP/offline/frontend" "$REGISTRY_PATH/kubeat-frontend@$FRONTEND_DIGEST"
          cosign save --dir "$RUNNER_TEMP/offline/chart" "$REGISTRY_PATH/charts/kubeat@$CHART_DIGEST"
          for artifact in backend frontend chart; do
            HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 NO_PROXY= \
              cosign verify --trusted-root "$root" --local-image \
                --certificate-identity "$IDENTITY" \
                --certificate-oidc-issuer "$ISSUER" \
                "$RUNNER_TEMP/offline/$artifact"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: release/sbom
          merge-multiple: true
      - name: Release notes
        run: |
          scripts/release-notes.sh release/sbom/*.spdx.json > release/notes.md
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.versions.outputs.version }}
          path: release/
          if-no-files-found: error
          overwrite: true

  # The tag's GitHub Release, from what the verify job wrote. The only job
  # that may write to the repository; a dry run has none.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [versions, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.versions.outputs.version }}
          path: release
      - name: GitHub Release
        # bash, not the default sh: with pipefail a failing tag listing stops
        # the step instead of leaving "newest" empty and the release not latest.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          # A patch for an older minor, tagged from a release/v* branch, does
          # not become the repository's latest release.
          newest="$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -n 1)"
          latest=false
          if [ "$newest" = "$VERSION" ]; then latest=true; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --latest="$latest" --title "Kubeat $VERSION" --notes-file release/notes.md \
            release/sbom/*.spdx.json
