# Scenarios for the PromQL examples of README "Kapsam ihlali denetimi", for
# "promtool test rules". Not part of the chart: deploy/helm/test-chart.sh
# takes the two examples from the README as written there, the first as the
# alert ReadmeScopeTarget and the second as ReadmeScopeResolveError, writes
# them to readme-rules.yaml next to a copy of this file and runs it. An
# example the README changes is tested as it then reads.
#
# The series are what the ServiceMonitor scrapes: every reason and source a
# refusal can be counted under is there from the start, at 0.
rule_files:
  - readme-rules.yaml

evaluation_interval: 1m

tests:
  - name: The README's attempt query fires for a write refused for its target, and only for that
    interval: 1m
    input_series:
      # A user's monitor is refused for its target at 2m. Writes refused for
      # their namespace, and annotation monitors' checks refused a
      # connection or a name that did not resolve, go on throughout.
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="target", source="user"}'
        values: '0 0 1x12'
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="namespace", source="user"}'
        values: '0+1x14'
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="connection", source="annotation"}'
        values: '0+1x14'
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="resolve_error", source="annotation"}'
        values: '0+1x14'
    alert_rule_test:
      - eval_time: 1m
        alertname: ReadmeScopeTarget
        exp_alerts: []
      - eval_time: 2m
        alertname: ReadmeScopeTarget
        exp_alerts:
          - exp_labels: &readme-target-labels
              job: kubeat-backend
              namespace: kubeat
              service: kubeat-backend
              endpoint: http
              container: backend
              pod: kubeat-backend-6c9d7f5b8-a1b2c
              instance: "10.128.2.15:8080"
              reason: target
              source: user
      - eval_time: 5m
        alertname: ReadmeScopeTarget
        exp_alerts:
          - exp_labels: *readme-target-labels
      # The window of 5 minutes, which leaves out its first instant, no
      # longer holds the sample before the refusal.
      - eval_time: 6m
        alertname: ReadmeScopeTarget
        exp_alerts: []
      # Annotation monitors' resolve errors are the chart's rule's.
      - eval_time: 10m
        alertname: ReadmeScopeResolveError
        exp_alerts: []

  - name: The README's DNS query fires for the resolve errors of users and of monitors without a record, not of annotation monitors
    interval: 1m
    input_series:
      # A user's request or monitor is refused a name that did not resolve
      # at 2m, a monitor set up before the scope was recorded at 5m.
      # Annotation monitors' resolve errors, and a user's monitor refused a
      # connection, go on throughout.
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="resolve_error", source="user"}'
        values: '0 0 1x12'
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="resolve_error", source="unrecorded"}'
        values: '0x4 1x9'
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="resolve_error", source="annotation"}'
        values: '0+1x14'
      - series: 'kubeat_target_scope_denied_total{job="kubeat-backend", namespace="kubeat", service="kubeat-backend", endpoint="http", container="backend", pod="kubeat-backend-6c9d7f5b8-a1b2c", instance="10.128.2.15:8080", reason="connection", source="user"}'
        values: '0+1x14'
    alert_rule_test:
      - eval_time: 1m
        alertname: ReadmeScopeResolveError
        exp_alerts: []
      - eval_time: 3m
        alertname: ReadmeScopeResolveError
        exp_alerts:
          - exp_labels: &readme-resolve-user-labels
              job: kubeat-backend
              namespace: kubeat
              service: kubeat-backend
              endpoint: http
              container: backend
              pod: kubeat-backend-6c9d7f5b8-a1b2c
              instance: "10.128.2.15:8080"
              reason: resolve_error
              source: user
      - eval_time: 5m
        alertname: ReadmeScopeResolveError
        exp_alerts:
          - exp_labels: *readme-resolve-user-labels
          - exp_labels:
              job: kubeat-backend
              namespace: kubeat
              service: kubeat-backend
              endpoint: http
              container: backend
              pod: kubeat-backend-6c9d7f5b8-a1b2c
              instance: "10.128.2.15:8080"
              reason: resolve_error
              source: unrecorded
      - eval_time: 12m
        alertname: ReadmeScopeResolveError
        exp_alerts: []
      # A user's monitor refused a connection is no attempt at another
      # team's target by a write: the attempt query stays silent.
      - eval_time: 12m
        alertname: ReadmeScopeTarget
        exp_alerts: []
