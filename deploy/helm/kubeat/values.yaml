# Images are published to ghcr.io on every release tag; a private registry
# mirror goes in the repositories below, and its credentials in
# imagePullSecrets (the names of Secrets in the release namespace).
imagePullSecrets: []

# The language of notifications and of the first administrator's name
# (backend), and the UI language for visitors whose browser asks for none
# we have (frontend): "en" or "tr". Visitors can switch the UI themselves.
language: en

# Where users reach Kubeat: for the links in notifications, the OIDC
# redirect URL, and the frontend's knowledge that users are on HTTPS (the
# session cookie's Secure flag, Strict-Transport-Security). Derived from
# route.host or ingress.host when they are set. With a Route whose host the
# router picks, set it to that host once the Route exists.
publicURL: ""   # https://kubeat.apps.example

backend:
  image:
    repository: ghcr.io/yusufceng/kubeat-backend
    tag: ""            # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  persistence:
    size: 2Gi
    storageClass: ""   # empty uses the cluster default
  # How long the backend may take to start before it is restarted:
  # failureThreshold × periodSeconds, 10 minutes. The first start with an
  # encryption key compacts the database (VACUUM) before it answers, which
  # takes a while for a large one on slow storage; one cut short is done
  # again by the next start. After three starts that did not finish it, the
  # next one comes up without it and logs an error: raise failureThreshold
  # then, and the start after that compacts.
  startupProbe:
    periodSeconds: 5
    failureThreshold: 120
  # Any UPTIME_* setting the chart has no value for, as environment variables
  # (the README lists them all). Do not repeat variables the chart itself
  # sets, such as UPTIME_ADDR, UPTIME_DB_PATH or UPTIME_SECRET_KEY. This is
  # the only place for them: the chart refuses a backend.env, which older
  # values files have, unless it is empty.
  extraEnv: {}
    # UPTIME_RETENTION: 168h
    # UPTIME_REMINDER_INTERVAL: 15m    # announce an ongoing outage again
    # UPTIME_NOTIFY_GROUP_WAIT: 30s    # "0" turns grouping off
    # UPTIME_RECOVERY_THRESHOLD: "1"
    # UPTIME_DEFAULT_FAILURE_THRESHOLD: "3"
    # UPTIME_CERT_WARNING: 336h
    # UPTIME_WORKLOAD_ROLLOUT_GRACE: 10m
    # Where checks and notifications may connect; loopback, link-local (cloud
    # metadata) and multicast are denied, private ranges are not (README,
    # "Hedef politikası"). Comma-separated CIDRs.
    # UPTIME_TARGET_ALLOW_CIDRS: "169.254.20.10/32"   # NodeLocal DNSCache as a DNS monitor's resolver
    # UPTIME_TARGET_DENY_CIDRS: "10.0.0.0/8"          # checks only outside the cluster
  # Extra volumes for the backend, e.g. a CA bundle for the metrics server or
  # for checks of targets signed by an internal CA.
  extraVolumes: []
  extraVolumeMounts: []

frontend:
  replicas: 1
  # Any frontend setting (REFRESH_INTERVAL_MS, HISTORY_LIMIT, ...; the
  # README lists them) the chart has no value for; BACKEND_URL is set by the
  # chart. This is the only place for them: the chart refuses a
  # frontend.env, which older values files have, unless it is empty.
  extraEnv: {}
    # REFRESH_INTERVAL_MS: "5000"
  # Whether the session cookie is marked Secure, so that browsers send it
  # over HTTPS only: "auto" when publicURL (or the Route or Ingress host it
  # is derived from, http:// with ingress.tls off) is https:// or the
  # request came over HTTPS; "always"; or "never", which users who reach the
  # UI over plain HTTP from anywhere but localhost need when publicURL is
  # https:// all the same, or when a plain-HTTP proxy in front talks HTTPS
  # to the Route without an X-Forwarded-Proto of its own; otherwise they
  # cannot sign in. "never", like an http:// publicURL, also keeps
  # upgrade-insecure-requests out of the Content-Security-Policy.
  cookieSecure: auto
  # The pages that may show status pages in a frame (a wiki, a wall
  # display), as a Content-Security-Policy frame-ancestors source list:
  # "https://wiki.example.com https://grafana.example.com". "'none'" allows
  # none; the rest of the UI is never shown in a frame.
  statusPageFrameAncestors: "'none'"
  # Strict-Transport-Security max-age in seconds, sent to browsers that
  # reach the UI over HTTPS: they keep to HTTPS for this host that long.
  # 0 turns it off.
  hstsMaxAge: 31536000
  image:
    repository: ghcr.io/yusufceng/kubeat-frontend
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Secrets under GitOps. The chart generates four Secrets on the first
# install and keeps them across upgrades by reading them back from the
# cluster: the administrator password (auth.existingSecret), the API token
# (apiToken.existingSecret), the encryption key (secretKey.existingSecret)
# and the metrics token (metrics.auth.existingSecret). A renderer without
# access to the cluster (helm template, Argo CD, OpenShift GitOps) cannot
# read them back: it generates new values on every render, and a sync
# overwrites the Secrets. A new encryption key is the worst of it: after its
# next restart the backend refuses it, and what the old key encrypted is
# lost with it. A new metrics token fails every scrape with 401 until the
# backend restarts. Under GitOps create all four yourself (Sealed Secrets,
# External Secrets, ...) and name them in those values; the README's
# "GitOps ile kurulum" says more. The values below point here.

# Sign-in to the UI with a single administrator password. By default the
# chart generates the password once and keeps it; the install notes say how
# to read it.
auth:
  # Name of an existing Secret with the key "password": the password of the
  # first administrator account, "admin", created on the backend's first
  # start. Afterwards accounts are managed in the UI. It has to pass the
  # password rules (UPTIME_PASSWORD_MIN_LENGTH characters to 72 bytes, not
  # "admin", "password" or another of the first guesses), or the backend
  # does not start while there is no account yet. Needed under GitOps (see
  # "Secrets under GitOps" above).
  existingSecret: ""
  sessionTtlHours: 12

# Sign-in with directory (LDAP) accounts, beside the local ones. Directory
# users get their role from the group mappings made in the UI. See the
# README for every UPTIME_LDAP_* setting; the rest go in extraEnv. Every
# directory sign-in also takes a bcrypt comparison, a quarter of a second
# of a core: for many directory users signing in at once, raise the
# backend's CPU limit or UPTIME_LOGIN_CONCURRENCY (backend.extraEnv).
ldap:
  url: ""                        # ldap://ldap.example.com:389 or ldaps://...:636
  baseDN: ""                     # where users are searched for
  userFilter: "(uid={username})" # Active Directory: (sAMAccountName={username})
  startTLS: false
  bindDN: ""                     # the account that searches for users
  bindPasswordSecret:
    name: ""
    key: password
  extraEnv: {}
    # UPTIME_LDAP_GROUP_ATTR: memberOf
    # UPTIME_LDAP_CA_FILE: /etc/kubeat/ldap-ca/ca.crt   (mount it with backend.extraVolumes)
    # UPTIME_LDAP_DEFAULT_ROLE: viewer
    # UPTIME_LDAP_DEFAULT_NAMESPACES: "*"

# Sign-in through an OpenID Connect provider (Keycloak, Azure AD, Okta,
# Dex...). Register Kubeat there with the redirect URL the install notes
# print. Unless redirectURL is set, the chart makes it from publicURL
# (<publicURL>/auth/callback), or else from route.host or ingress.host
# (https://<host>/auth/callback, https even with ingress.tls off, for when
# TLS ends in front of the ingress controller: SSO needs HTTPS there).
# Without any of them (a Route whose host the router picks) SSO does not
# work until publicURL is set to that host. The chart refuses a redirect
# URL the backend would turn SSO off for, anything but
# https://<host>/auth/callback (plain http:// only for localhost): a
# publicURL with a path needs redirectURL. Roles come from the group
# mappings on the Users page, as for LDAP.
oidc:
  issuer: ""                     # https://sso.example.com/realms/corp
  clientID: ""
  clientSecretSecret:            # optional: a public client uses PKCE alone
    name: ""
    key: client-secret
  redirectURL: ""                # https://<kubeat host>/auth/callback; derived from publicURL,
                                 # route.host or ingress.host. Must be https, with
                                 # nothing after /auth/callback.
  name: SSO                      # the sign-in button's label
  extraEnv: {}
    # UPTIME_OIDC_SCOPES: "openid profile email groups"
    # UPTIME_OIDC_GROUPS_CLAIM: groups
    # UPTIME_OIDC_CA_FILE: /etc/kubeat/oidc-ca/ca.crt   (mount it with backend.extraVolumes)
    # UPTIME_OIDC_DEFAULT_ROLE: viewer
    # UPTIME_OIDC_DEFAULT_NAMESPACES: "*"

# Periodic copies of the database on a volume of their own. A copy on the
# database's own volume would be lost together with it.
backup:
  enabled: false
  interval: 24h
  keep: 7
  persistence:
    size: 5Gi
    storageClass: ""     # empty uses the cluster default
    existingClaim: ""    # use this PVC instead of creating one

# The API token, for scripts and automation: a request presenting it acts as
# an administrator, which also makes it the way in when the administrators'
# accounts are locked. By default the chart generates it once and keeps it.
apiToken:
  # Name of an existing Secret with the key "token", to manage it yourself.
  # Needed under GitOps (see "Secrets under GitOps" above auth).
  existingSecret: ""

# The key that encrypts tokens, passwords and webhook addresses in the
# database. By default the chart generates it once and keeps it, also when
# the release is uninstalled. Keep a copy of it with your backups: a
# database is of no use without the key its secrets were encrypted with.
secretKey:
  # Name of an existing Secret with the key "key" (32 characters or more).
  # Needed under GitOps (see "Secrets under GitOps" above auth): there a
  # sync would replace the generated key, and the backend could no longer
  # read what it encrypted. The chart gives the backend the key from this
  # Secret as UPTIME_SECRET_KEY. UPTIME_SECRET_KEY_FILE is for installs
  # without the chart: never set it in backend.extraEnv, where the backend,
  # given both, does not start.
  existingSecret: ""

# Restricts who can connect to the backend at the network level, in addition
# to the tokens: the frontend, the Prometheus below and backendIngressFrom.
# Needs a network plugin that enforces NetworkPolicy. Only connections to the
# backend are restricted, never the backend's own: checks must reach any
# service, pod or address. With the policy on, jobs in other namespaces send
# push reports to the frontend instead, which passes them on
# (http://<release>-frontend.<namespace>.svc:3000/api/push/<token>); the UI
# shows that address.
networkPolicy:
  enabled: false
  # Who scrapes /metrics, allowed while metrics.serviceMonitor is on: by
  # default OpenShift's user workload monitoring. For the platform's own
  # Prometheus name openshift-monitoring; elsewhere the namespace of the
  # Prometheus, e.g. kubernetes.io/metadata.name: monitoring. A list of
  # NetworkPolicy "from" entries.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
  # Extra sources allowed to reach the backend, e.g. the namespace of jobs
  # that call the API with the API token. A list of NetworkPolicy "from"
  # entries.
  backendIngressFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ci

# Where pod CPU and memory usage is read from: any Prometheus-compatible
# API. Leave the URL empty to show pods without resource usage.
prometheus:
  url: ""
  # OpenShift: https://thanos-querier.openshift-monitoring.svc:9091 with the
  # pod's own service account token and the service CA.
  tokenFile: ""      # e.g. /var/run/secrets/kubernetes.io/serviceaccount/token
  caFile: ""         # e.g. /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  # Never together with tokenFile: the token would go to whoever answers at
  # the URL. Give caFile instead.
  insecureSkipVerify: false
  # OpenShift only: binds the service account to cluster-monitoring-view,
  # which Thanos Querier requires on port 9091 (queries across the cluster).
  # Port 9092 answers per namespace, for discovery.namespaces, without it.
  openshiftMonitoringView: false

# The backend serves Prometheus metrics at /metrics on its service port.
metrics:
  # The metrics name every monitor and its namespace, so they answer only
  # scrapes that present a token of their own as a bearer token
  # (UPTIME_METRICS_TOKEN). The chart generates it once and keeps it, and the
  # ServiceMonitor below sends it. A Prometheus configured by hand must send
  # it too (authorization.credentials_file), or set enabled to false, which
  # leaves /metrics open to anyone who can reach the backend.
  auth:
    enabled: true
    # Name of an existing Secret with the key "token", to manage it yourself.
    # Never the API token's Secret: the scraping Prometheus keeps a copy.
    # Needed under GitOps (see "Secrets under GitOps" above auth).
    existingSecret: ""
  # Creates a ServiceMonitor so the cluster's Prometheus scrapes them. Needs
  # the prometheus-operator CRDs; on OpenShift, user workload monitoring.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Creates a PrometheusRule so the cluster's Prometheus raises alerts from
  # the metrics: KubeatMonitorDown per open outage, KubeatCertificateExpiring,
  # and KubeatDown / KubeatSchedulerStalled for Kubeat itself. They reach the
  # Alertmanager and receivers the platform already has.
  prometheusRule:
    enabled: false
    labels: {}
    # The severity label of the per-monitor alerts.
    severity: warning
    certWarningDays: 14

# Dead man's switch: the backend requests this URL at every interval while
# it is scheduling checks. Point it at a service that alerts when the
# requests stop (healthchecks.io, an Uptime Kuma push monitor, ...), ideally
# one that runs outside this cluster.
heartbeat:
  interval: 1m
  # The URL usually embeds a secret key, so it is read from a Secret.
  urlSecret:
    name: ""
    key: url

# Where Telegram and PagerDuty notifications are sent. Leave empty for the
# services' own addresses; set them to go through a proxy of your own.
notifications:
  telegramApiUrl: ""
  pagerDutyEventsUrl: ""

# SMTP server for e-mail notification channels. E-mail is off while host or
# from is empty.
smtp:
  host: ""
  port: 587
  from: ""             # e.g. "Kubeat <kubeat@example.com>"
  security: starttls   # starttls, tls or none
  username: ""
  # The password is read from an existing Secret, never from values.
  passwordSecret:
    name: ""
    key: password

# Lets the backend list namespaces, services, pods, ingresses and routes
# (read-only, cluster-wide) so monitors can be created from what is running.
# Read-only still reveals a lot to whoever holds the backend's service
# account token: a pod or workload carries its literal environment values,
# a Route with an inline certificate its private key. On a cluster shared by
# teams, list the namespaces to watch below.
discovery:
  enabled: true
  # Limits discovery to these namespaces and grants read access there with
  # Roles instead of a ClusterRole, so that someone who administers the
  # namespaces but not the cluster can install Kubeat. Empty means the
  # whole cluster.
  namespaces: []
  # How often objects annotated kubeat.io/monitor=true are read and their
  # monitors created, updated or removed; "0" turns that off.
  syncInterval: 1m

# Pod-level security context for both workloads. Leave empty on OpenShift,
# which assigns the UID and fsGroup itself. On other clusters set fsGroup so
# the backend can write to its volume, e.g. {fsGroup: 1001}.
podSecurityContext: {}

# Exposes the frontend outside the cluster. Enable at most one.
route:
  enabled: false       # OpenShift Route, edge TLS; plain HTTP is redirected
  host: ""
  # Annotations for the OpenShift router, e.g.
  #   haproxy.router.openshift.io/hsts_header: max-age=31536000
  #     browsers then come back over HTTPS only (leave out preload on a
  #     shared apps domain)
  #   haproxy.router.openshift.io/rate-limit-connections: "true"
  #   haproxy.router.openshift.io/rate-limit-connections.rate-http: "500"
  #     at most 500 requests per client address in 10 seconds. Everything on
  #     the Route counts (the UI, status pages, badges, push reports), and
  #     clients behind one NAT share the limit.
  annotations: {}
ingress:
  enabled: false
  className: ""
  host: kubeat.local
  # e.g. cert-manager.io/cluster-issuer: letsencrypt, which also creates the
  # TLS Secret below; or the controller's own settings (HSTS, rate limits).
  annotations: {}
  # Signing in sends passwords (directory passwords too, with LDAP) and every
  # request the session cookie, so the Ingress serves host over HTTPS with
  # the kubernetes.io/tls Secret secretName. Turn it off only when TLS ends
  # in front of the ingress controller, at a load balancer; then set
  # publicURL to the https:// address, as the chart derives http:// from the
  # host for it. The OIDC redirect URL stays https://, for when TLS ends in
  # front of the controller: SSO needs HTTPS there. An Ingress served over
  # plain HTTP up to 0.37.0 needs that Secret now, or this turned off
  # knowingly: with TLS on, the address is https:// and the session cookie
  # Secure, so over plain HTTP nobody can sign in.
  tls:
    enabled: true
    secretName: ""     # defaults to <release>-tls
