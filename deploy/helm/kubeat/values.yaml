# Images are published to ghcr.io on every release tag; a private registry
# mirror goes in the repositories below, and its credentials in
# imagePullSecrets (the names of Secrets in the release namespace).
imagePullSecrets: []

# The language of notifications and of the first administrator's name
# (backend), and the UI language for visitors whose browser asks for none
# we have (frontend): "en" or "tr". Visitors can switch the UI themselves.
language: en

backend:
  image:
    repository: ghcr.io/yusufceng/kubeat-backend
    tag: ""            # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  # Extra settings as environment variables; see the README for the list.
  # UPTIME_ADDR and UPTIME_DB_PATH are set by the chart.
  env: {}
    # UPTIME_RETENTION: 168h
    # UPTIME_RECOVERY_THRESHOLD: "2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  persistence:
    size: 2Gi
    storageClass: ""   # empty uses the cluster default
  # Any UPTIME_* setting the chart has no value for (the README lists them
  # all). Do not repeat variables the chart itself sets.
  extraEnv: {}
    # UPTIME_REMINDER_INTERVAL: 15m    # announce an ongoing outage again
    # UPTIME_NOTIFY_GROUP_WAIT: 30s    # "0" turns grouping off
    # UPTIME_RECOVERY_THRESHOLD: "1"
    # UPTIME_DEFAULT_FAILURE_THRESHOLD: "3"
    # UPTIME_CERT_WARNING: 336h
    # UPTIME_WORKLOAD_ROLLOUT_GRACE: 10m
  # Extra volumes for the backend, e.g. a CA bundle for the metrics server or
  # for checks of targets signed by an internal CA.
  extraVolumes: []
  extraVolumeMounts: []

frontend:
  replicas: 1
  # Any frontend setting (REFRESH_INTERVAL_MS, HISTORY_LIMIT, ...; the
  # README lists them) the chart has no value for.
  extraEnv: {}
  image:
    repository: ghcr.io/yusufceng/kubeat-frontend
    tag: ""
    pullPolicy: IfNotPresent
  # BACKEND_URL is set by the chart.
  env: {}
    # REFRESH_INTERVAL_MS: "5000"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Sign-in to the UI with a single administrator password. By default the
# chart generates the password once and keeps it; the install notes say how
# to read it.
auth:
  # Name of an existing Secret with the key "password": the password of the
  # first administrator account, "admin", created on the backend's first
  # start. Afterwards accounts are managed in the UI.
  existingSecret: ""
  sessionTtlHours: 12

# Sign-in with directory (LDAP) accounts, beside the local ones. Directory
# users get their role from the group mappings made in the UI. See the
# README for every UPTIME_LDAP_* setting; the rest go in extraEnv.
ldap:
  url: ""                        # ldap://ldap.example.com:389 or ldaps://...:636
  baseDN: ""                     # where users are searched for
  userFilter: "(uid={username})" # Active Directory: (sAMAccountName={username})
  startTLS: false
  bindDN: ""                     # the account that searches for users
  bindPasswordSecret:
    name: ""
    key: password
  extraEnv: {}
    # UPTIME_LDAP_GROUP_ATTR: memberOf
    # UPTIME_LDAP_CA_FILE: /etc/kubeat/ldap-ca/ca.crt   (mount it with backend.extraVolumes)
    # UPTIME_LDAP_DEFAULT_ROLE: viewer
    # UPTIME_LDAP_DEFAULT_NAMESPACES: "*"

# Sign-in through an OpenID Connect provider (Keycloak, Azure AD, Okta,
# Dex...). Register Kubeat there with the redirect URL
# https://<kubeat host>/auth/callback; with route.host or ingress.host set
# the chart fills redirectURL in from it. Roles come from the group
# mappings on the Users page, as for LDAP.
oidc:
  issuer: ""                     # https://sso.example.com/realms/corp
  clientID: ""
  clientSecretSecret:            # optional: a public client uses PKCE alone
    name: ""
    key: client-secret
  redirectURL: ""                # defaults to https://<route or ingress host>/auth/callback
  name: SSO                      # the sign-in button's label
  extraEnv: {}
    # UPTIME_OIDC_SCOPES: "openid profile email groups"
    # UPTIME_OIDC_GROUPS_CLAIM: groups
    # UPTIME_OIDC_CA_FILE: /etc/kubeat/oidc-ca/ca.crt   (mount it with backend.extraVolumes)
    # UPTIME_OIDC_DEFAULT_ROLE: viewer
    # UPTIME_OIDC_DEFAULT_NAMESPACES: "*"

# Periodic copies of the database on a volume of their own. A copy on the
# database's own volume would be lost together with it.
backup:
  enabled: false
  interval: 24h
  keep: 7
  persistence:
    size: 5Gi
    storageClass: ""     # empty uses the cluster default
    existingClaim: ""    # use this PVC instead of creating one

# The backend API only answers requests carrying a shared secret, which the
# frontend sends. By default the chart generates it once and keeps it.
apiToken:
  # Name of an existing Secret with the key "token", to manage it yourself.
  existingSecret: ""

# The key that encrypts tokens, passwords and webhook addresses in the
# database. By default the chart generates it once and keeps it, also when
# the release is uninstalled. Keep a copy of it with your backups: a
# database is of no use without the key its secrets were encrypted with.
secretKey:
  # Name of an existing Secret with the key "key" (32 characters or more).
  existingSecret: ""

# Restricts who can connect to the backend at the network level, in addition
# to the token. Needs a network plugin that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  # Extra sources allowed to reach the backend, e.g. the namespace of the
  # Prometheus that scrapes /metrics. A list of NetworkPolicy "from" entries.
  backendIngressFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: openshift-user-workload-monitoring

# Where pod CPU and memory usage is read from: any Prometheus-compatible
# API. Leave the URL empty to show pods without resource usage.
prometheus:
  url: ""
  # OpenShift: https://thanos-querier.openshift-monitoring.svc:9091 with the
  # pod's own service account token and the service CA.
  tokenFile: ""      # e.g. /var/run/secrets/kubernetes.io/serviceaccount/token
  caFile: ""         # e.g. /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  insecureSkipVerify: false
  # OpenShift only: binds the service account to cluster-monitoring-view,
  # which Thanos Querier requires.
  openshiftMonitoringView: false

# The backend serves Prometheus metrics at /metrics on its service port.
metrics:
  # Creates a ServiceMonitor so the cluster's Prometheus scrapes them. Needs
  # the prometheus-operator CRDs; on OpenShift, user workload monitoring.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Creates a PrometheusRule so the cluster's Prometheus raises alerts from
  # the metrics: KubeatMonitorDown per open outage, KubeatCertificateExpiring,
  # and KubeatDown / KubeatSchedulerStalled for Kubeat itself. They reach the
  # Alertmanager and receivers the platform already has.
  prometheusRule:
    enabled: false
    labels: {}
    # The severity label of the per-monitor alerts.
    severity: warning
    certWarningDays: 14

# Dead man's switch: the backend requests this URL at every interval while
# it is scheduling checks. Point it at a service that alerts when the
# requests stop (healthchecks.io, an Uptime Kuma push monitor, ...), ideally
# one that runs outside this cluster.
heartbeat:
  interval: 1m
  # The URL usually embeds a secret key, so it is read from a Secret.
  urlSecret:
    name: ""
    key: url

# Where Telegram and PagerDuty notifications are sent. Leave empty for the
# services' own addresses; set them to go through a proxy of your own.
notifications:
  telegramApiUrl: ""
  pagerDutyEventsUrl: ""

# SMTP server for e-mail notification channels. E-mail is off while host or
# from is empty.
smtp:
  host: ""
  port: 587
  from: ""             # e.g. "Kubeat <kubeat@example.com>"
  security: starttls   # starttls, tls or none
  username: ""
  # The password is read from an existing Secret, never from values.
  passwordSecret:
    name: ""
    key: password

# Lets the backend list namespaces, services, pods, ingresses and routes
# (read-only, cluster-wide) so monitors can be created from what is running.
discovery:
  enabled: true
  # Limits discovery to these namespaces and grants read access there with
  # Roles instead of a ClusterRole, so that someone who administers the
  # namespaces but not the cluster can install Kubeat. Empty means the
  # whole cluster.
  namespaces: []
  # How often objects annotated kubeat.io/monitor=true are read and their
  # monitors created, updated or removed; "0" turns that off.
  syncInterval: 1m

# Pod-level security context for both workloads. Leave empty on OpenShift,
# which assigns the UID and fsGroup itself. On other clusters set fsGroup so
# the backend can write to its volume, e.g. {fsGroup: 1001}.
podSecurityContext: {}

# Exposes the frontend outside the cluster. Enable at most one.
route:
  enabled: false       # OpenShift Route
  host: ""
ingress:
  enabled: false
  className: ""
  host: kubeat.local
