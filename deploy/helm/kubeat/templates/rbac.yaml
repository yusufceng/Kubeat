{{- define "kubeat.discoveryRules" -}}
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
# Pods are only listed, never read one by one: discovery reads their probes,
# the pod panel their state. A list still returns whole pod specs, literal
# environment values included, so no verb more than needed is granted.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
# The events shown next to a monitor's pods.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list"]
# Workload monitors read how many pods of a workload are ready.
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
# Monitors that check each pod read the service's endpoints.
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list"]
{{- end }}
{{- if and .Values.discovery.enabled (not .Values.discovery.namespaces) }}
# Read-only access used to discover what can be monitored and to check
# workloads. Cluster-wide so that any namespace can be browsed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-discovery
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
rules:
  # Listed for the namespaces the discovery page offers; never read one by one.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  {{- include "kubeat.discoveryRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-discovery
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.discovery.enabled .Values.discovery.namespaces }}
# The same read-only access, in the listed namespaces only: for an
# installation by someone who administers those namespaces but not the
# cluster. Nothing cluster-wide is created.
{{- range $ns := .Values.discovery.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-discovery
  namespace: {{ $ns }}
  labels:
    {{- include "kubeat.labels" $ | nindent 4 }}
rules:
  {{- include "kubeat.discoveryRules" $ | nindent 2 }}
  # What OpenShift's namespace-scoped metrics endpoint (thanos-querier on
  # port 9092) asks of a caller, for the pods' CPU and memory.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-discovery
  namespace: {{ $ns }}
  labels:
    {{- include "kubeat.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.prometheus.openshiftMonitoringView }}
---
# Lets the service account query Thanos Querier on OpenShift.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-monitoring-view
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
