apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "kubeat.selector" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- include "kubeat.containerSecurityContext" . | nindent 12 }}
          env:
            - name: BACKEND_URL
              value: "http://{{ .Release.Name }}-backend:8080"
            - name: DEFAULT_LOCALE
              value: {{ .Values.language | quote }}
            # What push monitors show to jobs in other namespaces.
            - name: PUSH_INTERNAL_URL
              value: "http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc:8080"
            - name: SESSION_TTL_HOURS
              value: {{ .Values.auth.sessionTtlHours | quote }}
            # Whether users are on HTTPS, for the session cookie and
            # Strict-Transport-Security; the same address the backend gets.
            {{- with include "kubeat.publicURL" $ }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: COOKIE_SECURE
              value: {{ .Values.frontend.cookieSecure | quote }}
            - name: STATUS_PAGE_FRAME_ANCESTORS
              value: {{ .Values.frontend.statusPageFrameAncestors | quote }}
            # An int64 first: a number this large would print as 3.1536e+07.
            - name: HSTS_MAX_AGE
              value: {{ .Values.frontend.hstsMaxAge | int64 | quote }}
            {{- range $name, $value := .Values.frontend.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          # The sign-in page needs no session and no backend, so it answers
          # whenever the server itself is healthy.
          readinessProbe:
            httpGet:
              path: /login
              port: http
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "kubeat.selector" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
