apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "kubeat.selector" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- include "kubeat.containerSecurityContext" . | nindent 12 }}
          env:
            - name: BACKEND_URL
              value: "http://{{ .Release.Name }}-backend:8080"
            - name: DEFAULT_LOCALE
              value: {{ .Values.language | quote }}
            # Sent with every request to the backend, which reads the
            # browser's X-Forwarded-For only from a request that carries it.
            # Optional, as the backend's: without it the UI still serves.
            - name: FRONTEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeat.frontendTokenSecret" . }}
                  key: token
                  optional: true
            # What push monitors show to jobs in other namespaces. With the
            # NetworkPolicy only the frontend may reach the backend, so jobs
            # report to the frontend, which passes the reports on.
            - name: PUSH_INTERNAL_URL
              {{- if .Values.networkPolicy.enabled }}
              value: "http://{{ .Release.Name }}-frontend.{{ .Release.Namespace }}.svc:3000"
              {{- else }}
              value: "http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc:8080"
              {{- end }}
            - name: SESSION_TTL_HOURS
              value: {{ .Values.auth.sessionTtlHours | quote }}
            # Whether users are on HTTPS, for the session cookie and
            # Strict-Transport-Security; the same address the backend gets.
            {{- with include "kubeat.publicURL" $ }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /* These three came after 0.37.0: dig takes the default of values.yaml when they are missing (see _helpers.tpl). */}}
            - name: COOKIE_SECURE
              value: {{ dig "cookieSecure" "auto" .Values.frontend | quote }}
            - name: STATUS_PAGE_FRAME_ANCESTORS
              value: {{ dig "statusPageFrameAncestors" "'none'" .Values.frontend | quote }}
            # An int64 first: a number this large would print as 3.1536e+07.
            - name: HSTS_MAX_AGE
              value: {{ dig "hstsMaxAge" 31536000 .Values.frontend | int64 | quote }}
            {{- range $name, $value := .Values.frontend.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          # The sign-in page needs no session and no backend, so it answers
          # whenever the server itself is healthy.
          readinessProbe:
            httpGet:
              path: /login
              port: http
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with dig "service" "annotations" (dict) .Values.frontend }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with dig "service" "type" "" .Values.frontend }}
  type: {{ . }}
  {{- end }}
  selector:
    {{- include "kubeat.selector" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
