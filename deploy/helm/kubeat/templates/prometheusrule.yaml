{{- if .Values.metrics.prometheusRule.enabled }}
{{- /*
The labels a scrape gives a series that change with every backend pod, or
say only how it was scraped. The alerts that hold their state over a scrape
gap are aggregated without them, so that the pod a Recreate brings, under a
new name and address, carries on the alerts of the pod before it instead of
raising them a second time.
*/}}
{{- $scrape := "instance, pod, endpoint, container, service" }}
{{- $up := printf "up{job=%q, namespace=%q}" (printf "%s-backend" .Release.Name) .Release.Namespace }}
{{- /*
What tells one installation's series from another's, and what the alerts of
an installation and of one of its monitors are aggregated by. By default
namespace and job, and everything but the scrape labels: each cluster's own
Prometheus evaluates the rules, and the rules render as in 0.44. With
metrics.prometheusRule.clusterLabel the rules are evaluated over the series
of several clusters in one store (Grafana Cloud or Mimir, a global Thanos
Ruler): they then group by that label beside namespace and job, so that one
cluster's backend does not hide another's, and drop every other label the
store adds, such as the replica label of an HA pair it does not
deduplicate, by which one replica's gone series would raise a false alert or
a second one.
*/}}
{{- $cluster := include "kubeat.clusterLabel" . }}
{{- $installation := "namespace, job" }}
{{- $byInstallation := printf "without (%s)" $scrape }}
{{- $byMonitor := printf "without (%s)" $scrape }}
{{- if $cluster }}
{{- $installation = printf "namespace, job, %s" $cluster }}
{{- $byInstallation = printf "by (%s)" $installation }}
{{- $byMonitor = printf "by (%s, monitor, monitor_namespace, type)" $installation }}
{{- end }}
# Alerts the cluster's own Prometheus raises from Kubeat's metrics, so that
# outages reach the Alertmanager and receivers the platform already has.
# Needs the ServiceMonitor (or another scrape of /metrics, which then sends
# the metrics token and gives the series the job and namespace labels the
# ServiceMonitor gives them) to be in place.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubeat.monitors
      rules:
        # Kubeat has already applied the monitor's failure threshold, so the
        # incident itself is the signal; no extra "for" is needed. While the
        # per-monitor metrics are scraped they decide, so a closed outage
        # resolves on the next scrape. While they are not (a failed scrape,
        # the minutes a Recreate takes to move the volume, a scrape in which
        # the database could not be read), the last value of the past 10
        # minutes holds the alert instead of resolving it. A longer failed
        # scrape is KubeatDown's, which fires after 5 minutes; a longer
        # database read failure resolves them while KubeatMetricsIncomplete
        # fires.
        - alert: KubeatMonitorDown
          expr: |-
            max {{ $byMonitor }} (kubeat_monitor_incident_open) == 1
            or (
              max {{ $byMonitor }} (last_over_time(kubeat_monitor_incident_open[10m])) == 1
              unless on ({{ $installation }}) (kubeat_monitor_scrape_success == 1)
            )
          labels:
            severity: {{ .Values.metrics.prometheusRule.severity | quote }}
          annotations:
            summary: {{ `"{{ $labels.monitor }} is down"` }}
            description: {{ `"Kubeat monitor {{ $labels.monitor }} ({{ $labels.type }}{{ if $labels.monitor_namespace }}, namespace {{ $labels.monitor_namespace }}{{ end }}) has an open outage."` }}
        # The expiry is held over a scrape gap the same way, so that the gap
        # neither resolves the alert nor starts its 10 minutes over.
        - alert: KubeatCertificateExpiring
          expr: |-
            (
              max {{ $byMonitor }} (kubeat_monitor_cert_expiry_timestamp_seconds)
              or (
                max {{ $byMonitor }} (last_over_time(kubeat_monitor_cert_expiry_timestamp_seconds[10m]))
                unless on ({{ $installation }}) (kubeat_monitor_scrape_success == 1)
              )
            ) - time() < {{ .Values.metrics.prometheusRule.certWarningDays }} * 86400
          for: 10m
          labels:
            severity: {{ .Values.metrics.prometheusRule.severity | quote }}
          annotations:
            summary: {{ `"certificate of {{ $labels.monitor }} expires in {{ $value | humanizeDuration }}"` }}
    - name: kubeat.self
      rules:
        # Also with no backend target at all: a pod that is pending, deleted
        # or put to sleep, or never got an address, leaves no up series, and
        # "up == 0" alone stays silent then. Either way the alert carries
        # only job and namespace, so it stays one alert from a failing scrape
        # to a pod that is gone. absent() of "up == 1" would be the same
        # test, but takes no labels from a comparison.
        {{- if $cluster }}
        # Over the series of several clusters, absent() fires only once no
        # cluster has a backend left: a cluster whose up series was seen in
        # the last 24 hours and is gone fires on its own, with its {{ $cluster }}
        # label. An absence longer than that is the heartbeat's to tell.
        {{- end }}
        - alert: KubeatDown
          expr: |-
            max by ({{ $installation }}) ({{ $up }}) == 0
            {{- if $cluster }}
            or (
              group by ({{ $installation }}) (max_over_time({{ $up }}[24h]))
              unless group by ({{ $installation }}) ({{ $up }})
            )
            {{- end }}
            or absent({{ $up }})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubeat's metrics cannot be scraped"
            description: "Kubeat's backend has not answered Prometheus for 5 minutes, or it has no pod at all (pending, deleted, put to sleep): nothing checks the monitors meanwhile. Its per-monitor and backup alerts keep their last state for 10 minutes and then resolve, unless an inhibit rule in the Alertmanager mutes them while this alert fires."
        - alert: KubeatSchedulerStalled
          expr: time() - kubeat_scheduler_last_tick_timestamp_seconds > 60
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubeat's scheduler has stopped ticking"
        # What the heartbeat judges, read from the backend at every scrape,
        # so that it is heard without a dead man's switch too. A loss of
        # some results only is KubeatResultsDropped's warning, and no
        # backend at all KubeatDown's: without the series this stays silent.
        # A stalled scheduler fires this and KubeatSchedulerStalled both.
        - alert: KubeatUnhealthy
          expr: max {{ $byInstallation }} (kubeat_self_healthy) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubeat's checks are not running, or their results are not stored"
            description: "For 5 minutes Kubeat has not been doing its job (kubeat_self_healthy, what the heartbeat sends on): in the last heartbeat interval its scheduler completed no tick, or check results came and none of them could be stored (a full or read-only data volume), or one write of them outlasted the interval (a hung volume). No outage is opened and no notification sent meanwhile; the backend's log says why (self-health failing, with the reason; list monitors failed, batch insert failed)."
        - alert: KubeatMetricsIncomplete
          expr: kubeat_monitor_scrape_success == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Kubeat could not read its monitors from the database for the metrics"
        - alert: KubeatResultsDropped
          expr: increase(kubeat_results_dropped_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Kubeat is losing check results"
            description: "Check results could not be written to the database in the last 10 minutes, so the uptime history has gaps; the backend's log says why (a full data volume, a database that stays locked)."
        # Every attempt counts, not only the notification given up on: an
        # outage notification is attempted again while the outage lasts,
        # and the alert must fire while the channel is not taking it.
        - alert: KubeatNotificationsFailing
          expr: increase(kubeat_notification_attempts_total{result="failed"}[15m]) > 0 or increase(kubeat_notifications_dropped_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Kubeat notifications are not being delivered"
            description: {{ `"{{ if $labels.channel_type }}An attempt to deliver to a {{ $labels.channel_type }} channel failed{{ else }}Notifications were dropped because the delivery queue was full{{ end }} in the last 15 minutes, so an outage may have gone unannounced. An outage notification is attempted again while the outage lasts, so this fires while a channel is not taking it, not once the engine gives up; the Channels page shows each channel's last delivery error, and the backend's log the rest."` }}
        - alert: KubeatWorkersSaturated
          expr: increase(kubeat_scheduler_dispatch_skipped_total[10m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Kubeat's workers cannot keep up with the checks"
            description: "For 15 minutes due checks have been left for the next tick because every worker stayed busy, so checks run late: raise UPTIME_WORKERS, or look for targets that hold checks until their timeout."
        # The newest attempt failed: the last failure is newer than the last
        # good copy. Unlike a count of failures over a window, it stays until
        # a backup succeeds: over the whole interval a full volume waits, and
        # with no copy at all. Both are times, which only grow within a
        # process, so each is read as its largest value of the past 10
        # minutes across pods: a restarted backend, in the same pod or in a
        # new one, reports no failure until its first attempt ends, and its
        # last value would resolve the alert meanwhile.
        - alert: KubeatBackupFailing
          expr: |-
            max {{ $byInstallation }} (max_over_time(kubeat_backup_last_failure_timestamp_seconds[10m]))
            > max {{ $byInstallation }} (max_over_time(kubeat_backup_last_success_timestamp_seconds[10m]))
          labels:
            severity: warning
          annotations:
            summary: "Kubeat's database backup is failing"
            description: "The newest backup attempt failed and none has succeeded since, so the newest good copy keeps getting older; the backend's log says why (a full backup volume, a copy that did not verify, a backup directory it cannot use). A full volume is tried again only after backup.interval, and the alert stays meanwhile."
        {{- if .Values.backup.enabled }}
        - alert: KubeatBackupStale
          expr: (time() - kubeat_backup_last_success_timestamp_seconds) > 2 * {{ include "kubeat.durationSeconds" (list .Values.backup.interval "backup.interval") }} and kubeat_backup_last_success_timestamp_seconds > 0
          labels:
            severity: warning
          annotations:
            summary: {{ `"Kubeat's newest database backup is {{ $value | humanizeDuration }} old"` }}
            description: "No backup has succeeded for twice the backup interval (backup.interval); the backend's log says what went wrong. The newest copy on the backup volume counts, so a restart does not start this over."
        {{- end }}
        - alert: KubeatLicenseExpiring
          expr: (kubeat_license_expiry_timestamp_seconds - time()) < 30 * 86400 and kubeat_license_expiry_timestamp_seconds > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: {{ `"Kubeat Enterprise license {{ if lt $value 0.0 }}has expired{{ else }}expires in {{ $value | humanizeDuration }}{{ end }}"` }}
            description: "When the license ends, signing in through LDAP and OIDC, namespace-limited users, the audit log and the extra status pages stop; monitoring itself goes on. A renewed license Secret takes effect within minutes, without a restart."
        - alert: KubeatLicenseExpiring
          expr: (kubeat_license_expiry_timestamp_seconds - time()) < 7 * 86400 and kubeat_license_expiry_timestamp_seconds > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: {{ `"Kubeat Enterprise license {{ if lt $value 0.0 }}has expired{{ else }}expires in {{ $value | humanizeDuration }}{{ end }}"` }}
            description: "When the license ends, signing in through LDAP and OIDC, namespace-limited users, the audit log and the extra status pages stop; monitoring itself goes on. A renewed license Secret takes effect within minutes, without a restart."
{{- end }}
