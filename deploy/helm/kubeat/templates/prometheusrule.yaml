{{- if .Values.metrics.prometheusRule.enabled }}
# Alerts the cluster's own Prometheus raises from Kubeat's metrics, so that
# outages reach the Alertmanager and receivers the platform already has.
# Needs the ServiceMonitor (or another scrape of /metrics, which then sends
# the metrics token) to be in place.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubeat.monitors
      rules:
        # Kubeat has already applied the monitor's failure threshold, so the
        # incident itself is the signal; no extra "for" is needed.
        - alert: KubeatMonitorDown
          expr: kubeat_monitor_incident_open == 1
          labels:
            severity: {{ .Values.metrics.prometheusRule.severity | quote }}
          annotations:
            summary: {{ `"{{ $labels.monitor }} is down"` }}
            description: {{ `"Kubeat monitor {{ $labels.monitor }} ({{ $labels.type }}{{ if $labels.monitor_namespace }}, namespace {{ $labels.monitor_namespace }}{{ end }}) has an open outage."` }}
        - alert: KubeatCertificateExpiring
          expr: (kubeat_monitor_cert_expiry_timestamp_seconds - time()) < {{ .Values.metrics.prometheusRule.certWarningDays }} * 86400
          for: 10m
          labels:
            severity: {{ .Values.metrics.prometheusRule.severity | quote }}
          annotations:
            summary: {{ `"certificate of {{ $labels.monitor }} expires in {{ $value | humanizeDuration }}"` }}
    - name: kubeat.self
      rules:
        - alert: KubeatDown
          expr: up{job={{ printf "%s-backend" .Release.Name | quote }}} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubeat's metrics cannot be scraped"
            description: "Nothing is checking the monitors while Kubeat is down; the KubeatMonitorDown alerts are silent, not resolved."
        - alert: KubeatSchedulerStalled
          expr: time() - kubeat_scheduler_last_tick_timestamp_seconds > 60
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubeat's scheduler has stopped ticking"
        - alert: KubeatMetricsIncomplete
          expr: kubeat_monitor_scrape_success == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Kubeat could not read its monitors from the database for the metrics"
        - alert: KubeatResultsDropped
          expr: increase(kubeat_results_dropped_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Kubeat is losing check results"
            description: "Check results could not be written to the database in the last 10 minutes, so the uptime history has gaps; the backend's log says why (a full data volume, a database that stays locked)."
        - alert: KubeatNotificationsFailing
          expr: increase(kubeat_notifications_total{result="failed"}[15m]) > 0 or increase(kubeat_notifications_dropped_total[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Kubeat notifications are not being delivered"
            description: {{ `"{{ if $labels.channel_type }}Deliveries to {{ $labels.channel_type }} channels failed after their retries{{ else }}Notifications were dropped because the delivery queue was full{{ end }} in the last 15 minutes, so an outage may have gone unannounced; the Channels page shows each channel's last delivery error, and the backend's log the rest."` }}
        - alert: KubeatWorkersSaturated
          expr: increase(kubeat_scheduler_dispatch_skipped_total[10m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Kubeat's workers cannot keep up with the checks"
            description: "For 15 minutes due checks have been left for the next tick because every worker stayed busy, so checks run late: raise UPTIME_WORKERS, or look for targets that hold checks until their timeout."
        - alert: KubeatBackupFailing
          expr: increase(kubeat_backups_total{result="failed"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Kubeat's database backup is failing"
            description: "A backup attempt failed in the last hour, and the newest good copy is getting older meanwhile; the backend's log says why (a full backup volume, a copy that did not verify)."
        {{- if .Values.backup.enabled }}
        - alert: KubeatBackupStale
          expr: (time() - kubeat_backup_last_success_timestamp_seconds) > 2 * {{ include "kubeat.durationSeconds" (list .Values.backup.interval "backup.interval") }} and kubeat_backup_last_success_timestamp_seconds > 0
          labels:
            severity: warning
          annotations:
            summary: {{ `"Kubeat's newest database backup is {{ $value | humanizeDuration }} old"` }}
            description: "No backup has succeeded for twice the backup interval (backup.interval); the backend's log says what went wrong. The newest copy on the backup volume counts, so a restart does not start this over."
        {{- end }}
        - alert: KubeatLicenseExpiring
          expr: (kubeat_license_expiry_timestamp_seconds - time()) < 30 * 86400 and kubeat_license_expiry_timestamp_seconds > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: {{ `"Kubeat Enterprise license {{ if lt $value 0.0 }}has expired{{ else }}expires in {{ $value | humanizeDuration }}{{ end }}"` }}
            description: "When the license ends, signing in through LDAP and OIDC, namespace-limited users, the audit log and the extra status pages stop; monitoring itself goes on. A renewed license Secret takes effect within minutes, without a restart."
        - alert: KubeatLicenseExpiring
          expr: (kubeat_license_expiry_timestamp_seconds - time()) < 7 * 86400 and kubeat_license_expiry_timestamp_seconds > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: {{ `"Kubeat Enterprise license {{ if lt $value 0.0 }}has expired{{ else }}expires in {{ $value | humanizeDuration }}{{ end }}"` }}
            description: "When the license ends, signing in through LDAP and OIDC, namespace-limited users, the audit log and the extra status pages stop; monitoring itself goes on. A renewed license Secret takes effect within minutes, without a restart."
{{- end }}
