apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backend.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # SQLite allows a single writer, and the volume is ReadWriteOnce: never run
  # two backend pods, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "kubeat.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: {{ or .Values.discovery.enabled (ne .Values.prometheus.tokenFile "") }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Lets in-flight checks stop and the last results be written.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "kubeat.containerSecurityContext" . | nindent 12 }}
          env:
            - name: UPTIME_ADDR
              value: ":8080"
            - name: UPTIME_DB_PATH
              value: /data/uptime.db
            - name: UPTIME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeat.apiTokenSecret" . }}
                  key: token
            - name: UPTIME_DISCOVERY_ENABLED
              value: {{ .Values.discovery.enabled | quote }}
            {{- with .Values.prometheus }}
            {{- if .url }}
            - name: UPTIME_PROMETHEUS_URL
              value: {{ .url | quote }}
            {{- with .tokenFile }}
            - name: UPTIME_PROMETHEUS_TOKEN_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .caFile }}
            - name: UPTIME_PROMETHEUS_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- if .insecureSkipVerify }}
            - name: UPTIME_PROMETHEUS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.heartbeat }}
            {{- if .urlSecret.name }}
            - name: UPTIME_HEARTBEAT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .urlSecret.name }}
                  key: {{ .urlSecret.key }}
            - name: UPTIME_HEARTBEAT_INTERVAL
              value: {{ .interval | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.smtp }}
            {{- if and .host .from }}
            - name: UPTIME_SMTP_HOST
              value: {{ .host | quote }}
            - name: UPTIME_SMTP_PORT
              value: {{ .port | quote }}
            - name: UPTIME_SMTP_FROM
              value: {{ .from | quote }}
            - name: UPTIME_SMTP_SECURITY
              value: {{ .security | quote }}
            {{- with .username }}
            - name: UPTIME_SMTP_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .passwordSecret.name }}
            - name: UPTIME_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .passwordSecret.name }}
                  key: {{ .passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.backend.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "kubeat.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
