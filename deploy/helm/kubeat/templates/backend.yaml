{{- include "kubeat.checkValues" . -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
  {{- if include "kubeat.keepData" . }}
  annotations:
    {{- include "kubeat.keepAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backend.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}
{{- if and .Values.backup.enabled (not .Values.backup.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
  {{- if include "kubeat.keepBackup" . }}
  annotations:
    {{- include "kubeat.keepAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # SQLite allows a single writer, and the volume is ReadWriteOnce: never run
  # two backend pods, not even during a rollout.
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "kubeat.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ or .Values.discovery.enabled (ne .Values.prometheus.tokenFile "") }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Lets in-flight checks stop and the last results be written.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "kubeat.containerSecurityContext" . | nindent 12 }}
          env:
            - name: UPTIME_ADDR
              value: ":8080"
            - name: UPTIME_DB_PATH
              value: /data/uptime.db
            - name: UPTIME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeat.apiTokenSecret" . }}
                  key: token
            {{- if include "kubeat.metricsAuth" . }}
            - name: UPTIME_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeat.metricsTokenSecret" . }}
                  key: token
            {{- end }}
            - name: UPTIME_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKey.existingSecret | default (printf "%s-secret-key" .Release.Name) }}
                  key: key
            - name: UPTIME_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-admin" .Release.Name) }}
                  key: password
            - name: UPTIME_SESSION_TTL
              value: {{ printf "%dh" (int .Values.auth.sessionTtlHours) | quote }}
            {{- with .Values.ldap }}
            {{- if .url }}
            - name: UPTIME_LDAP_URL
              value: {{ .url | quote }}
            - name: UPTIME_LDAP_BASE_DN
              value: {{ .baseDN | quote }}
            - name: UPTIME_LDAP_USER_FILTER
              value: {{ .userFilter | quote }}
            - name: UPTIME_LDAP_START_TLS
              value: {{ .startTLS | quote }}
            {{- with .bindDN }}
            - name: UPTIME_LDAP_BIND_DN
              value: {{ . | quote }}
            {{- end }}
            {{- if .bindPasswordSecret.name }}
            - name: UPTIME_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .bindPasswordSecret.name }}
                  key: {{ .bindPasswordSecret.key }}
            {{- end }}
            {{- range $name, $value := .extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.oidc }}
            {{- if .issuer }}
            {{- include "kubeat.checkOIDCRedirect" $ }}
            - name: UPTIME_OIDC_ISSUER
              value: {{ .issuer | quote }}
            - name: UPTIME_OIDC_CLIENT_ID
              value: {{ .clientID | quote }}
            {{- with include "kubeat.oidcRedirectURL" $ }}
            - name: UPTIME_OIDC_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: UPTIME_OIDC_NAME
              value: {{ .name | quote }}
            {{- if .clientSecretSecret.name }}
            - name: UPTIME_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .clientSecretSecret.name }}
                  key: {{ .clientSecretSecret.key }}
            {{- end }}
            {{- range $name, $value := .extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: UPTIME_LANGUAGE
              value: {{ .Values.language | quote }}
            {{- with include "kubeat.publicURL" $ }}
            - name: UPTIME_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: UPTIME_DISCOVERY_ENABLED
              value: {{ .Values.discovery.enabled | quote }}
            {{- with .Values.discovery.namespaces }}
            - name: UPTIME_DISCOVERY_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: UPTIME_DISCOVERY_SYNC_INTERVAL
              value: {{ .Values.discovery.syncInterval | quote }}
            {{- if .Values.backup.enabled }}
            - name: UPTIME_BACKUP_DIR
              value: /backup
            - name: UPTIME_BACKUP_INTERVAL
              value: {{ .Values.backup.interval | quote }}
            - name: UPTIME_BACKUP_KEEP
              value: {{ .Values.backup.keep | quote }}
            {{- end }}
            {{- if .Values.license.existingSecret }}
            - name: UPTIME_LICENSE_FILE
              value: /etc/kubeat/license/license
            {{- end }}
            {{- with .Values.prometheus }}
            {{- if .url }}
            - name: UPTIME_PROMETHEUS_URL
              value: {{ .url | quote }}
            {{- with .tokenFile }}
            - name: UPTIME_PROMETHEUS_TOKEN_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .caFile }}
            - name: UPTIME_PROMETHEUS_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- if .insecureSkipVerify }}
            - name: UPTIME_PROMETHEUS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.notifications.telegramApiUrl }}
            - name: UPTIME_TELEGRAM_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.notifications.pagerDutyEventsUrl }}
            - name: UPTIME_PAGERDUTY_EVENTS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.heartbeat }}
            {{- if .urlSecret.name }}
            - name: UPTIME_HEARTBEAT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .urlSecret.name }}
                  key: {{ .urlSecret.key }}
            - name: UPTIME_HEARTBEAT_INTERVAL
              value: {{ .interval | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.smtp }}
            {{- if and .host .from }}
            - name: UPTIME_SMTP_HOST
              value: {{ .host | quote }}
            - name: UPTIME_SMTP_PORT
              value: {{ .port | quote }}
            - name: UPTIME_SMTP_FROM
              value: {{ .from | quote }}
            - name: UPTIME_SMTP_SECURITY
              value: {{ .security | quote }}
            {{- with .username }}
            - name: UPTIME_SMTP_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .passwordSecret.name }}
            - name: UPTIME_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .passwordSecret.name }}
                  key: {{ .passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.backend.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          # Until the backend first answers, only this probe runs: the first
          # start with an encryption key compacts the database before it
          # serves anything, which the liveness probe would cut short.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: {{ dig "startupProbe" "periodSeconds" 5 .Values.backend }}
            failureThreshold: {{ dig "startupProbe" "failureThreshold" 120 .Values.backend }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.backup.enabled }}
            - name: backup
              mountPath: /backup
            {{- end }}
            {{- if .Values.license.existingSecret }}
            # The whole directory, so that a renewed Secret reaches the
            # file and the backend reads it again without a restart.
            - name: license
              mountPath: /etc/kubeat/license
              readOnly: true
            {{- end }}
            # The root filesystem is read-only; SQLite keeps temporary files here.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.backup.enabled }}
        - name: backup
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.existingClaim | default (printf "%s-backup" .Release.Name) }}
        {{- end }}
        {{- with .Values.license.existingSecret }}
        - name: license
          secret:
            secretName: {{ . }}
            items:
              - key: license
                path: license
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "kubeat.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
