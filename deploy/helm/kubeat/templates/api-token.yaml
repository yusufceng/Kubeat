{{- /*
The shared secret between the frontend and the backend API. Generated once
and kept across upgrades; set apiToken.existingSecret to manage it yourself.
It is also left in place when the release is removed, like the database's PVC
and tied to the same switch (backend.persistence.keepOnUninstall): a reinstall
with the same release name and namespace then keeps the token, so scripts that
use it over the API go on working.
*/ -}}
{{- if not .Values.apiToken.existingSecret }}
{{- $name := printf "%s-api-token" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
  {{- if include "kubeat.keepData" . }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
