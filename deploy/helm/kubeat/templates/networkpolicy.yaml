{{- if .Values.networkPolicy.enabled }}
# Only the frontend (and the sources listed in values) may connect to the
# backend. Probes come from the node and are not subject to the policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      from:
        - podSelector:
            matchLabels:
              {{- include "kubeat.selector" . | nindent 14 }}
              app.kubernetes.io/component: frontend
        {{- with .Values.networkPolicy.backendIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
