{{- if .Values.networkPolicy.enabled }}
# Only the frontend, the Prometheus of the ServiceMonitor and the sources
# listed in values may connect to the backend. Probes come from the node and
# are not subject to the policy. What the backend connects to is not
# restricted: checks must reach any service, pod or address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      from:
        - podSelector:
            matchLabels:
              {{- include "kubeat.selector" . | nindent 14 }}
              app.kubernetes.io/component: frontend
        {{- if .Values.metrics.serviceMonitor.enabled }}
        {{- /* metricsFrom came after 0.37.0; its default as in values.yaml (see _helpers.tpl). */}}
        {{- $userWorkloadMonitoring := list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "openshift-user-workload-monitoring"))) }}
        {{- with dig "metricsFrom" $userWorkloadMonitoring .Values.networkPolicy }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- with .Values.networkPolicy.backendIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- /*
The frontend's own policy, on a switch of its own (frontend.networkPolicy):
never tied to networkPolicy.enabled, which sends the push jobs of other
namespaces to the frontend, where a policy that lets in only the router
would cut them off. Read with dig: it came after 0.49; the default "from"
as in values.yaml. An empty "from" would let everyone in, so it fails the
render.
*/}}
{{- if dig "networkPolicy" "enabled" false .Values.frontend }}
{{- $router := list (dict "namespaceSelector" (dict "matchLabels" (dict "policy-group.network.openshift.io/ingress" ""))) }}
{{- $from := dig "networkPolicy" "from" $router .Values.frontend }}
{{- if not $from }}
{{- fail "frontend.networkPolicy.enabled is true but frontend.networkPolicy.from is empty, which would let every source in: list the namespace of the router or ingress controller (README, \"Hesaplar ve giriş\", \"Arayüzün ağ politikası\")" }}
{{- end }}
---
# Only the router or ingress controller and the sources listed in
# frontend.networkPolicy.from may connect to the frontend: a pod that
# reaches the frontend's Service directly could otherwise send it an
# X-Forwarded-For of its own, which the frontend passes on to the backend
# with the sign-in. Probes come from the node and are not subject to the
# policy. What the frontend connects to is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      from:
        {{- toYaml $from | nindent 8 }}
{{- end }}
