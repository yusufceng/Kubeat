{{- if .Values.networkPolicy.enabled }}
# Only the frontend, the Prometheus of the ServiceMonitor and the sources
# listed in values may connect to the backend. Probes come from the node and
# are not subject to the policy. What the backend connects to is not
# restricted: checks must reach any service, pod or address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeat.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      from:
        - podSelector:
            matchLabels:
              {{- include "kubeat.selector" . | nindent 14 }}
              app.kubernetes.io/component: frontend
        {{- if .Values.metrics.serviceMonitor.enabled }}
        {{- with .Values.networkPolicy.metricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- with .Values.networkPolicy.backendIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
