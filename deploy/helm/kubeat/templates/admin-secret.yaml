{{- /*
The administrator password of the UI and the key that signs session cookies.
Generated once and kept across upgrades; set auth.existingSecret to manage
them yourself.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-admin" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ index $data "password" | default (randAlphaNum 20 | b64enc) }}
  session-secret: {{ index $data "session-secret" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
