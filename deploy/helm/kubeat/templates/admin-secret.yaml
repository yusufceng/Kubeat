{{- /*
The password of the first administrator account ("admin"), which the backend
creates on its first start. Generated once and kept across upgrades; set
auth.existingSecret to manage it yourself.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-admin" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ index $data "password" | default (randAlphaNum 20 | b64enc) }}
{{- end }}
