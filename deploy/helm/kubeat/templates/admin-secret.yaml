{{- /*
The password of the first administrator account ("admin"), which the backend
creates on its first start. Generated once and kept across upgrades; set
auth.existingSecret to manage it yourself. It is also left in place when the
release is removed, like the database's PVC and tied to the same switch
(backend.persistence.keepOnUninstall): a reinstall with the same release name
and namespace then keeps the password, so the old one still works and the
install notes do not print a password the database does not know.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-admin" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
  {{- if include "kubeat.keepData" . }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  password: {{ index $data "password" | default (randAlphaNum 20 | b64enc) }}
{{- end }}
