{{- /*
The key that encrypts the secrets kept in the database: tokens, passwords,
webhook addresses. Generated once and kept across upgrades. It is also kept
when the release is uninstalled: a database (or a backup of one) is of no
use without the key its secrets were encrypted with. Set
secretKey.existingSecret to manage it yourself.
*/ -}}
{{- if not .Values.secretKey.existingSecret }}
{{- $name := printf "%s-secret-key" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeat.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "key") }}
  key: {{ index $existing.data "key" }}
  {{- else }}
  key: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
