# A small namespace to try discovery against:
#   kubectl --context minikube apply -f deploy/demo/shop.yaml
#
#   web     healthy, HTTP readiness probe  -> HTTP check on the probe's path
#   cache   healthy, no HTTP probe         -> TCP check
#   broken  readiness probe never passes   -> HTTP check that fails
#   stock   gRPC readiness probe           -> gRPC health check
apiVersion: v1
kind: Namespace
metadata:
  name: shop-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /index.html, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop-demo
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: shop-demo
spec:
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - {containerPort: 6379}
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: shop-demo
spec:
  selector: {app: cache}
  ports:
    - {port: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
  namespace: shop-demo
spec:
  selector:
    matchLabels: {app: broken}
  template:
    metadata:
      labels: {app: broken}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}   # nginx answers 404
---
apiVersion: v1
kind: Service
metadata:
  name: broken
  namespace: shop-demo
spec:
  selector: {app: broken}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: shop-demo
spec:
  rules:
    - host: shop.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
---
# A gRPC server that implements the health checking protocol.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: shop-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: stock}
  template:
    metadata:
      labels: {app: stock}
    spec:
      containers:
        - name: grpc
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          command: ["/agnhost", "grpc-health-checking", "--port", "5000", "--http-port", "8081"]
          ports:
            - {name: grpc, containerPort: 5000}
          readinessProbe:
            grpc: {port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  namespace: shop-demo
spec:
  selector: {app: stock}
  ports:
    - {name: grpc, port: 5000, targetPort: grpc}
